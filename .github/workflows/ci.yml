name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result rather than cancelling the rest on the
      # first failure; which versions break is the useful information.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # --locked installs exactly what uv.lock pins and fails if the lock is
      # out of date, so a new release of a dependency cannot change what CI
      # tests without a commit that says so.
      - name: Install
        run: uv sync --locked --extra dev

      # Integration tests are excluded by pyproject's addopts: they need
      # Poland's sandbox, and CI must not go red because a government service
      # is down. They run on their own schedule (integration.yml). Everything
      # else, Schematron included, runs offline against the vendored artefacts.
      - name: Test
        run: uv run --no-sync pytest

      # The suite imports the package via pythonpath, so it would pass even if
      # the installed entry point were broken.
      - name: Smoke-test the installed CLI
        run: |
          source .venv/bin/activate
          .github/smoke-test.sh

  # uv sync installs the project editable, so the package it runs is the
  # checkout and anything outside src/ still resolves. A user who runs
  # `pip install git+...` gets a wheel instead; this installs one the same way,
  # into a venv that has never seen the repo, and runs the same smoke test.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build
        run: uv build --out-dir dist

      - name: Install the wheel, not editable
        run: |
          uv venv "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv" dist/*.whl

      - name: Smoke-test the installed wheel
        run: |
          source "$RUNNER_TEMP/wheel-venv/bin/activate"
          # Fail loudly if the checkout, rather than the wheel, is imported.
          python -c "import eu_einvoice_bridge, sys; sys.exit('site-packages' not in eu_einvoice_bridge.__file__)"
          .github/smoke-test.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked --extra dev

      - name: Ruff
        run: uv run --no-sync ruff check src tests

      - name: Mypy (strict)
        run: uv run --no-sync mypy
