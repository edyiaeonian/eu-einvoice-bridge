name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result rather than cancelling the rest on the
      # first failure; which versions break is the useful information.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # --locked installs exactly what uv.lock pins and fails if the lock is
      # out of date, so a new release of a dependency cannot change what CI
      # tests without a commit that says so.
      - name: Install
        run: uv sync --locked --extra dev

      # Integration tests are excluded by pyproject's addopts: they need
      # Poland's sandbox, and CI must not go red because a government service
      # is down. They run on their own schedule (integration.yml). Everything
      # else, Schematron included, runs offline against the vendored artefacts.
      - name: Test
        run: uv run --no-sync pytest

      # The suite imports the package via pythonpath, so it would pass even if
      # the installed entry point were broken. This exercises the path a user
      # actually takes.
      - name: Smoke-test the installed CLI
        run: |
          source .venv/bin/activate
          einvoice validate examples/invoice.json
          einvoice convert examples/invoice.json -o /tmp/invoice.xml
          grep -q "urn:cen.eu:en16931:2017" /tmp/invoice.xml
          einvoice validate examples/invoice-fa3.json --format fa3
          einvoice convert examples/invoice-fa3.json --format fa3 -o /tmp/invoice-fa3.xml
          grep -q "http://crd.gov.pl/wzor/2025/06/25/13775/" /tmp/invoice-fa3.xml
          einvoice validate examples/invoice-eur.json
          einvoice validate examples/invoice-eur.json --format fa3
          # submit needs the KSeF sandbox, so CI only checks that it loads.
          einvoice submit --help > /dev/null

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked --extra dev

      - name: Ruff
        run: uv run --no-sync ruff check src tests

      - name: Mypy (strict)
        run: uv run --no-sync mypy
