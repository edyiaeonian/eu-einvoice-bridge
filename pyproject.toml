[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eu-einvoice-bridge"
version = "0.1.0"
description = "Bridge a neutral invoice model to EN16931 (UBL 2.1) and Poland's KSeF FA(3)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Edward Jiang" }]

dependencies = [
    "pydantic>=2.9",
    "lxml>=5.3",
    "saxonche>=13.0",
    "cryptography>=43",
    "httpx>=0.27",
    "signxml>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.15",
    "mypy>=1.18",
]

[project.scripts]
einvoice = "eu_einvoice_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eu_einvoice_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the src tree on sys.path directly, so tests never depend on the editable
# install resolving. A venv inside an iCloud-synced folder gets the UF_HIDDEN
# flag, and Python 3.14's site.py silently skips hidden .pth files.
pythonpath = ["src"]
# Integration tests need the network and Poland's KSeF sandbox; the suite must
# not go red because a government service is down. Run them with:
#   pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: needs the network and the KSeF sandbox (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Chosen explicitly rather than taking the default set. Not included: FURB157,
# which rewrites Decimal("0") as Decimal(0) -- this code builds every Decimal
# from a string so that no value ever passes through a float.
select = ["E", "F", "W", "I", "UP", "B", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# Tests build fixed, naive-looking dates on purpose, and their names are
# sentences, which a line limit would only push onto awkward wrapped lines.
"tests/**" = ["DTZ", "E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]
# lxml, saxonche and httpx's JSON return Any; flagging every value passed on
# from them would bury the findings that matter.
warn_return_any = false
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# These ship no type information (lxml-stubs exists but lags lxml and
# rejects standard usage such as a None key in nsmap).
module = ["lxml.*", "saxonche.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# signxml is typed but re-exports XAdESSigner from its documented path
# (signxml.xades) without an __all__.
module = ["signxml.*"]
implicit_reexport = true
